# Waveshare ESP32-P4-NANO (P4 rev 3.x) with an SC2336 or OV5647 on the MIPI-CSI port.
# Pins follow the dev kit's own wiring.
esphome:
  name: p4-nano-camera

packages:
  audio: !include p4-devkit-audio.yaml

esp32:
  variant: esp32p4
  engineering_sample: false  # rev 3.x silicon on the Nano
  # sdkconfig.nano in the IDF project sets this rev-3 MSPI workaround
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_P4_REV3_MSPI_CRASH_AFTER_POWER_UP_WORKAROUND: y
      CONFIG_P4_REV3_MSPI_WORKAROUND_SIZE: "0x100"

psram:
  mode: hex
  speed: 200MHz

external_components:
  - source:
      type: local
      path: ../components

esp32_hosted:            # Wi-Fi through the on-board ESP32-C6 over SDIO
  variant: ESP32C6
  slot: 1
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # power save froze the live view

logger:
  hardware_uart: UART0   # the Nano's USB-C is a CH343 on UART0
  logs:
    esp-idf: WARN         # the IPA's per-frame debug lines flooded UART0 and starved loopTask (task WDT, 31 Oct)
api:
ota:
  - platform: esphome

# One bus for the camera's SCCB and the ES8311 codec, as on the dev kit.
i2c:
  id: bus_a
  sda: GPIO7
  scl: GPIO8
  frequency: 100kHz

esp32p4_camera:
  id: door_cam
  name: Door camera
  i2c_id: bus_a
  sensors: [sc2336]
  ipa_json: ../ipa/sc2336_yondoor.json
  jpeg_quality: 40
  max_framerate: 10 fps
  idle_framerate: 0.1 fps

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# 1080p H.264 to the dev kit's micro SD slot (slot 0, 4-bit, powered from on-chip LDO 4).
# The card is never formatted: an unreadable card only disables the recorder.
esp32p4_recorder:
  id: recorder
  camera_id: door_cam
  microphone: door_mic     # from p4-devkit-audio.yaml; adds an AAC track
  sd_card:
    clk_pin: GPIO43
    cmd_pin: GPIO44
    data_pins: [GPIO39, GPIO40, GPIO41, GPIO42]
    power_ldo_channel: 4
    frequency: 10MHz   # Nano: every write fails CRC at 20 MHz 4-bit; clean at 10 MHz (31 Oct)
  bitrate: 4000000
  min_qp: 25
  max_qp: 45
  gop: 30
  on_finished:
    - logger.log:
        format: "Clip saved: %s"
        args: [file.c_str()]

button:
  - platform: template
    name: Record 60 s
    on_press:
      - esp32p4_recorder.start:
          duration: 60s
  - platform: template
    name: Stop recording
    on_press:
      - esp32p4_recorder.stop

binary_sensor:
  - platform: template
    name: Recording
    lambda: return id(recorder).is_recording();
